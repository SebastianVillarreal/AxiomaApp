<div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <nb-card>
            <nb-card-header>
                <h5>
                    Tipo Movimiento | Formulario
                </h5>
            </nb-card-header>
            <nb-card-body class="form-grid">
                <div>
                    <label class="label">*Descripción</label>
                    <input formControlName="descripcion" type="text" nbInput fullWidth>
                    <div *ngIf="form.get('descripcion')?.touched && form.get('descripcion')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('descripcion')?.errors?.['required']">Descripción de tipo requerida*</p>
                    </div>
                </div>
                <div *ngIf="form.get('id')?.value !== 0">
                    <label class="label">Estatus</label>
                    <nb-radio-group formControlName="estatus">
                        <nb-radio [value]="1" checked>Activo</nb-radio>
                        <nb-radio [value]="0">Inactivo</nb-radio>
                    </nb-radio-group>
                </div>
            </nb-card-body>
            <nb-card-footer>
                <button nbButton status="primary" type="submit" [disabled]="!form.valid">Guardar</button>
            </nb-card-footer>
        </nb-card>
    </form>
</div>

<div>
    <app-custom-table
        tableHead="Módulos | Tabla"
        keyRow="Id"
        [headers]="['#', 'Descripción', 'Fecha registro','Fecha Actualiza', 'Usuario']"
        [keys]="['Id','Descripcion', 'FechaRegistro','FechaActualiza','UsuarioActualiza']"
        [data]="tiposList"
        [hasEdit]="true"
        [hasDelete]="true"
        [hasSearch]="true"
        (editEmit)="editTipo($event)"
        (deleteEmit)="deleteTipo($event)">
    ></app-custom-table>
</div>
