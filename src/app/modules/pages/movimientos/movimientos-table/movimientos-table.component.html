<ng-template #dialog let-data let-ref="dialogRef">
    <nb-card>
        <nb-card-header>
            Movimiento #{{data.Id}}
        </nb-card-header>
        <nb-card-body class="form-grid">
            <form [formGroup]="form"  (ngSubmit)="onSubmit()" novalidate>
                <div>
                    <label class="label">*Almacen:</label>
                    <nb-select formControlName="idAlmacen" fullWidth>
                        <nb-option value="0" disabled>Almacenes</nb-option>
                        <nb-option *ngFor="let sucursal of sucursalesList" [value]="sucursal.Id">{{sucursal.Nombre}}</nb-option>
                    </nb-select>
                    <div *ngIf="form.get('idAlmacen')?.touched && form.get('idAlmacen')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('idAlmacen')?.errors?.['required']">
                        Almacen requerido*
                        </p>
                    </div>
                    <div *ngIf="form.get('idAlmacen')?.touched && form.get('idAlmacen')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('idAlmacen')?.errors?.['min']">
                        Seleccione un Almacen*
                        </p>
                    </div>
                </div>
                <div>
                    <label class="label">*Tipo de Movimiento:</label>
                    <nb-select formControlName="tipoMovimiento" fullWidth>
                    <nb-option value="0" disabled>Tipos</nb-option>
                    <nb-option *ngFor="let tipo of tipoMovimientosList" [value]="tipo.Id">{{tipo.Descripcion}}</nb-option>
                    </nb-select>
                    <div *ngIf="form.get('tipoMovimiento')?.touched && form.get('tipoMovimiento')?.invalid">
                    <p class="text-danger text-sm italic" *ngIf="form.get('tipoMovimiento')?.errors?.['required']">
                        Tipo de Movimiento requerido*
                    </p>
                    </div>
                    <div *ngIf="form.get('tipoMovimiento')?.touched && form.get('tipoMovimiento')?.invalid">
                    <p class="text-danger text-sm italic" *ngIf="form.get('tipoMovimiento')?.errors?.['min']">
                        Seleccione un Tipo de Movimiento*
                    </p>
                    </div>
                </div>
                <div>
                    <label class="label">Estatus</label>
                    <nb-radio-group formControlName="estatus">
                        <nb-radio [value]="1" checked>Activo</nb-radio>
                        <nb-radio [value]="0">Inactivo</nb-radio>
                    </nb-radio-group>
                </div>
                <div class="mt-5">
                    <button nbButton status="primary" type="submit" [disabled]="!form.valid">Guardar</button>
                </div>
            </form>
        </nb-card-body>
        <nb-card-footer>
            <button nbButton (click)="ref.close()">Cerrar</button>
        </nb-card-footer>
    </nb-card>
</ng-template>


<div>
    <app-custom-table
    tableHead="Movimientos| Tabla"
    keyRow="Id"
    [headers]="['#', 'Almacen', 'Tipo Movimiento', 'Fecha Creación', 'Fecha Autorización','Usuario Registra', 'Usuario Autoriza', 'Fecha Actualiza', 'Usuario Actualiza', 'Mensaje']"
    [keys]="['Id', 'NombreAlmacen', 'TipoMovimiento','FechaCreacion','FechaAutorizacion','UsuarioRegistra','UsuarioAutoriza', 'FechaActualiza', 'UsuarioActualiza','Mensaje']"
    [data]="movimientosList"
    [hasDelete]="true"
    [hasEdit]="true"
    [hasDetails]="true"
    [hasSearch]="true"
    [hasExport]="true"
    (exportEmit)="exportMovimientos()"
    (deleteEmit)="deleteMovimiento($event)"
    (editEmit)="editMovimiento($event)">
    ></app-custom-table>
</div>
