<div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <nb-card>
            <nb-card-header>
                <h5>
                    Detalle Movimiento #{{idMovimiento}} | Formulario
                </h5>
            </nb-card-header>
            <nb-card-body class="form-grid">
                <div>
                    <label class="label">*Insumo:</label>
                    <nb-select formControlName="insumo" fullWidth>
                        <nb-option value="0" disabled>Insumos</nb-option>
                        <nb-option *ngFor="let insumo of insumosList" [value]="insumo.Insumo">{{insumo.Descripcion}}</nb-option>
                    </nb-select>
                    <div *ngIf="form.get('insumo')?.touched && form.get('insumo')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('insumo')?.errors?.['required']">Insumo requerido*</p>
                    </div>
                </div>
                <div>
                    <label class="label">*Cantidad:</label>
                    <input formControlName="cantidad" type="number" nbInput fullWidth min="0">
                    <div *ngIf="form.get('cantidad')?.touched && form.get('cantidad')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('cantidad')?.errors?.['required']">Cantidad Enviada requerida*</p>
                    </div>
                </div>
                <div *ngIf="form.get('id')?.value !== 0">
                    <label class="label">Estatus</label>
                    <nb-radio-group formControlName="estatus">
                        <nb-radio [value]="1" checked>Activo</nb-radio>
                        <nb-radio [value]="0">Inactivo</nb-radio>
                    </nb-radio-group>
                </div>
            </nb-card-body>
            <nb-card-footer>
                <button nbButton status="primary" [disabled]="!form.valid" type="submit">Guardar</button>
            </nb-card-footer>
        </nb-card>
    </form>
</div>

<div>
    <app-custom-table
    tableHead="Detalles Movimiento #{{idMovimiento}} | Tabla"
    keyRow="Id"
    [headers]="['#', 'Movimiento' ,'Insumo', 'Cantidad', 'Fecha Registro', 'Fecha Actualiza', ' Usuario', 'Mensaje']"
    [keys]="['Id', 'IdMovimiento', 'Insumo', 'Cantidad', 'FechaRegistro', 'FechaActualiza', 'UsuarioActualiza', 'Mensaje']"
    [data]="detallesList"
    [hasDelete]="true"
    [hasEdit]="true"
    (editEmit)="editDetalle($event)"></app-custom-table>
</div>
