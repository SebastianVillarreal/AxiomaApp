<div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <nb-card>
            <nb-card-header>
                <h5>
                    Detalles Traspaso #{{idTraspaso}} | Formulario
                </h5>
            </nb-card-header>
            <nb-card-body class="form-grid">
                <div>
                    <label class="label">*Insumo:</label>
                    <nb-select formControlName="insumo" fullWidth>
                        <nb-option value="0" disabled>Insumos</nb-option>
                        <nb-option *ngFor="let insumo of insumosList" [value]="insumo.Insumo">{{insumo.Descripcion}}</nb-option>
                    </nb-select>
                    <div *ngIf="form.get('insumo')?.touched && form.get('insumo')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('insumo')?.errors?.['required']">Insumo requerido*</p>
                    </div>
                </div>
                <div>
                    <label class="label">*Cantidad Enviada:</label>
                    <input formControlName="cantidadEnviada" type="number" nbInput fullWidth min="0">
                    <div *ngIf="form.get('cantidadEnviada')?.touched && form.get('cantidadEnviada')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('cantidadEnviada')?.errors?.['required']">Cantidad Enviada requerida*</p>
                    </div>
                </div>
                <div *ngIf="form.get('id')?.value !== 0">
                    <label class="label">*Cantidad Recibida:</label>
                    <input formControlName="cantidadRecibida" type="number" nbInput fullWidth min="0">
                    <div *ngIf="form.get('cantidadRecibida')?.touched && form.get('cantidadRecibida')?.invalid">
                        <p class="text-danger text-sm italic" *ngIf="form.get('cantidadRecibida')?.errors?.['required']">Cantidad Recibida requerida*</p>
                    </div>
                </div>
            </nb-card-body>
            <nb-card-footer>
                <button nbButton status="primary" [disabled]="!form.valid" type="submit">Guardar</button>
            </nb-card-footer>
        </nb-card>
    </form>
</div>

<div>
    <app-custom-table
    tableHead="Detalles Traspaso | Tabla"
    keyRow="Id"
    [headers]="['#', '# Traspaso', 'Insumo', 'Almacen Origen', 'Almacen Destino', 'Cantidad Enviada', 'Cantidad Recibida', 'Fecha Registro','Fecha Actualiza','Usuario Actualiza', 'Usuario Envía', 'Usuario Recibe', 'Fecha Inicio', 'Fecha Final']"
    [keys]="['Id', 'IdTraspaso', 'Insumo','AlmacenOrigen','AlmacenDestino', 'CantidadEnviada', 'CatidadRecibida','FechaRegistro','FechaActualiza','UsuarioActualiza','UsuarioEnvía', 'UsuarioRecibe', 'FechaInicio', 'FechaFinal']"
    [data]="detallesList"
    [hasDelete]="true"
    [hasEdit]="true"
    (editEmit)="editDetalle($event)"
    (deleteEmit)="deleteDetalle($event)"
    ></app-custom-table>
</div>
